<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Clientes</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <!-- LOGIN -->
    <div id="loginDiv" class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-header text-center bg-primary text-white">
                    <h4>Iniciar Sesión</h4>
                </div>
                <div class="card-body">

                    <input type="text" id="user" class="form-control mb-3" placeholder="Usuario">
                    <input type="password" id="pass" class="form-control mb-3" placeholder="Contraseña">

                    <button class="btn btn-primary w-100" onclick="login()">Ingresar</button>

                </div>
            </div>
        </div>
    </div>

    <!-- APP -->
    <div id="app" style="display:none;">

        <h3 class="mb-4">Mantenimiento de Clientes</h3>

        <div class="row">

            <!-- FORM -->
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h5>Cliente</h5>
                    </div>
                    <div class="card-body">

                        <input type="hidden" id="codiClie">

                        <input type="text" id="ndni" class="form-control mb-2" placeholder="DNI">
                        <input type="text" id="appa" class="form-control mb-2" placeholder="Apellido Paterno">
                        <input type="text" id="apma" class="form-control mb-2" placeholder="Apellido Materno">
                        <input type="text" id="nomb" class="form-control mb-2" placeholder="Nombre">
                        <input type="date" id="fecha" class="form-control mb-3">

                        <button class="btn btn-success w-100" onclick="guardarCliente()">Guardar</button>

                    </div>
                </div>
            </div>

            <!-- TABLA -->
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h5>Lista de Clientes</h5>
                    </div>
                    <div class="card-body">

                        <table class="table table-bordered table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>DNI</th>
                                    <th>Nombre</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaClientes"></tbody>
                        </table>

                    </div>
                </div>
            </div>

        </div>

    </div>

</div>

<!-- ALERTA -->
<div id="alerta" class="position-fixed top-0 end-0 p-3" style="z-index:9999;"></div>

<script>

const URL = "http://localhost:8081";

// 🔔 ALERTA BONITA
function mostrarAlerta(mensaje, tipo="success") {
    document.getElementById("alerta").innerHTML = `
        <div class="alert alert-${tipo} alert-dismissible fade show">
            ${mensaje}
            <button class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
}

// 🔐 LOGIN
function login() {

    const data = {
        user: document.getElementById("user").value,
        pass: document.getElementById("pass").value
    };

    fetch(URL + "/api/usuarios/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(resp => {

        if (resp.codiUsua) {
            mostrarAlerta("Bienvenido " + resp.logiUsua);
            document.getElementById("loginDiv").style.display = "none";
            document.getElementById("app").style.display = "block";
            listarClientes();
        } else {
            mostrarAlerta(resp.mensaje, "danger");
        }

    });
}

// 📋 LISTAR
function listarClientes() {

    fetch(URL + "/api/clientes")
        .then(res => res.json())
        .then(data => {

            let html = "";

            data.forEach(c => {
                html += `
                    <tr>
                        <td>${c.codiClie}</td>
                        <td>${c.ndniClie}</td>
                        <td>${c.nombClie}</td>
                        <td>
                            <button class="btn btn-warning btn-sm" onclick="editar(${c.codiClie})">✏️</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminar(${c.codiClie})">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById("tablaClientes").innerHTML = html;
        });
}

// 💾 GUARDAR
function guardarCliente() {

    const id = document.getElementById("codiClie").value;

    const cliente = {
        ndniClie: document.getElementById("ndni").value,
        appaClie: document.getElementById("appa").value,
        apmaClie: document.getElementById("apma").value,
        nombClie: document.getElementById("nomb").value,
        fechNaciClie: document.getElementById("fecha").value
    };

    let metodo = "POST";
    let url = URL + "/api/clientes";

    if (id) {
        metodo = "PUT";
        url += "/" + id;
    }

    fetch(url, {
        method: metodo,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cliente)
    })
    .then(() => {
        mostrarAlerta("Guardado correctamente");
        limpiar();
        listarClientes();
    });
}

// ✏️ EDITAR
function editar(id) {

    fetch(URL + "/api/clientes/" + id)
        .then(res => res.json())
        .then(c => {
            document.getElementById("codiClie").value = c.codiClie;
            document.getElementById("ndni").value = c.ndniClie;
            document.getElementById("appa").value = c.appaClie;
            document.getElementById("apma").value = c.apmaClie;
            document.getElementById("nomb").value = c.nombClie;
            document.getElementById("fecha").value = c.fechNaciClie;
        });
}

// ❌ ELIMINAR
function eliminar(id) {

    if (!confirm("¿Eliminar cliente?")) return;

    fetch(URL + "/api/clientes/" + id, {
        method: "DELETE"
    })
    .then(() => {
        mostrarAlerta("Eliminado correctamente", "warning");
        listarClientes();
    });
}

// 🧹 LIMPIAR
function limpiar() {
    document.getElementById("codiClie").value = "";
    document.getElementById("ndni").value = "";
    document.getElementById("appa").value = "";
    document.getElementById("apma").value = "";
    document.getElementById("nomb").value = "";
    document.getElementById("fecha").value = "";
}

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
